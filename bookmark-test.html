
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ブックマーク保存テスト</title>
<style>
body{font-family:system-ui,sans-serif;max-width:620px;margin:40px auto;padding:20px;line-height:1.7}
input,button{font:inherit;padding:10px;box-sizing:border-box}
input{width:100%;margin:8px 0 16px}
button{cursor:pointer;margin:5px 8px 5px 0}
pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f2f4f7;padding:15px;border-radius:8px}
</style>
</head>
<body>
<h1>ブックマーク保存テスト</h1>
<p>GitHubの非公開ファイルを読み込み、テスト記事を1件追加します。</p>

<label for="token">GitHub認証キー</label>
<input id="token" type="password"
 placeholder="ここに認証キーを貼り付け"
 autocomplete="off">

<button id="read">① 読み込みテスト</button>
<button id="save">② テスト記事を保存</button>

<pre id="result">まだ実行していません。</pre>

<script>
const owner="akien-coder";
const repo="regional-economy-bookmarks";
const path="bookmarks.json";

const api=`https://api.github.com/repos/${owner}/${repo}/contents/${path}`;

const tokenInput=document.getElementById("token");
const result=document.getElementById("result");
const readButton=document.getElementById("read");
const saveButton=document.getElementById("save");

function message(text){
 result.textContent=text;
}

function encodeBase64(text){
 const bytes=new TextEncoder().encode(text);
 let binary="";
 for(const b of bytes)binary+=String.fromCharCode(b);
 return btoa(binary);
}

function decodeBase64(text){
 const binary=atob(text.replace(/\s/g,""));
 const bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));
 return new TextDecoder().decode(bytes);
}

async function request(method,body){
 const token=tokenInput.value.trim();

 if(!token){
  throw new Error("認証キーを入力してください。");
 }

 const response=await fetch(api,{
  method,
  headers:{
   "Accept":"application/vnd.github+json",
   "Authorization":`Bearer ${token}`,
   "X-GitHub-Api-Version":"2022-11-28",
   ...(body?{"Content-Type":"application/json"}:{})
  },
  ...(body?{body:JSON.stringify(body)}:{})
 });

 const data=await response.json();

 if(!response.ok){
  throw new Error(
   `HTTP ${response.status}: ${data.message||"GitHub APIエラー"}`
  );
 }

 return data;
}

async function load(){
 const file=await request("GET");
 const articles=JSON.parse(decodeBase64(file.content));

 if(!Array.isArray(articles)){
  throw new Error("bookmarks.json が配列ではありません。");
 }

 return {articles,sha:file.sha};
}

async function runRead(){
 try{
  readButton.disabled=true;
  message("GitHubから読み込み中…");

  const {articles}=await load();

  message(`読み込み成功！\n現在の保存件数：${articles.length}件`);
 }catch(error){
  message("読み込み失敗：\n"+error.message);
 }finally{
  readButton.disabled=false;
 }
}

async function runSave(){
 try{
  saveButton.disabled=true;
  message("GitHubに保存中…");

  const {articles,sha}=await load();

  const testId="regional-bookmark-test-001";

  if(articles.some(a=>a.id===testId)){
   message("テスト記事は既に保存されています。");
   return;
  }

  articles.push({
   id:testId,
   region:"鶴岡",
   title:"【テスト】ブックマーク保存確認",
   publisher:"テスト",
   date:"2026-10-24",
   url:"https://github.com/",
   saved_at:new Date().toISOString(),
   summary:"保存機能の動作確認用記事です。"
  });

  await request("PUT",{
   message:"Test bookmark saving",
   content:encodeBase64(JSON.stringify(articles,null,2)+"\n"),
   sha
  });

  message(`保存成功！\n現在の保存件数：${articles.length}件`);

 }catch(error){
  message("保存失敗：\n"+error.message);
 }finally{
  saveButton.disabled=false;
 }
}

readButton.addEventListener("click",runRead);
saveButton.addEventListener("click",runSave);
</script>
</body>
</html>
